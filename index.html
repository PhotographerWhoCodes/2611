  { dot: '徽', hl: true, name: { zh: '皖南', en: 'Anhui' }, nights: { zh: '3晚', en: '3 nights' }, anchor: 'stage-IV' },
  { conn: '🚄' },
  { dot: '沪', hl: true, name: { zh: '上海', en: 'Shanghai' }, nights: { zh: '4晚', en: '4 nights' }, anchor: 'stage-V' },
  { conn: '✈' },
  { dot: '🏠', hl: false, name: { zh: '返程', en: 'Homeward' }, nights: { zh: '', en: '' }, anchor: null }
];

function t(key) { return T[key][lang]; }

function render() {
  const isEn = lang === 'en';
  const ed = EDITORIAL[lang];
  document.getElementById('intro-label').textContent=ed.label;
  document.getElementById('intro-title').textContent=ed.title;
  document.getElementById('intro-body').textContent=ed.body;
  document.getElementById('chapter-label').textContent=ed.chapter;
  document.getElementById('practical-title').textContent=ed.practical;
  document.getElementById('practical-label').textContent=ed.stay;
  document.getElementById('principles').innerHTML=ed.principles.map((p,i)=>'<div class="principle"><span class="eyebrow">0'+(i+1)+'</span><br><strong>'+p[0]+'</strong><p>'+p[1]+'</p></div>').join('');
  document.getElementById('practical-table').innerHTML=ed.hotels.map(p=>'<tr><td>'+p[0]+'</td><td>'+p[1]+'</td></tr>').join('');
  document.getElementById('cover-ornament').textContent = t('ornament');
  document.getElementById('cover-title').textContent = t('title');
  const titleZh = document.getElementById('cover-title-zh');
  if (titleZh) titleZh.textContent = isEn ? 'Ancient traditions · Modern marvels · Together' : '古老传统 · 现代科技 · 家人同行';
  const coverSub = document.getElementById('cover-sub');
  if (coverSub) coverSub.textContent = t('sub');
  document.getElementById('cover-meta').innerHTML = t('meta');
  document.getElementById('route-label').textContent = t('routeLabel');
  document.getElementById('footer-title').textContent = t('footer');

  const rf = document.getElementById('route-flow');
  rf.innerHTML = ROUTE.map(r => {
    if (r.conn) {
      return '<div class="route-conn"><div class="route-conn-line"></div><div class="route-conn-icon">' + r.conn + '</div></div>';
    }
    return '<div class="route-stop">' +
      (r.anchor ? '<a href="#' + r.anchor + '" style="text-decoration:none;display:contents">' : '') +
      '<div class="route-dot' + (r.hl ? ' hl' : '') + '" style="' + (r.anchor ? 'cursor:pointer' : '') + '">' + r.dot + '</div>' +
      '<div class="route-name" style="' + (r.anchor ? 'color:#7a5c1a' : '') + '">' + r.name[lang] + '</div>' +
      (r.nights[lang] ? '<div class="route-nights">' + r.nights[lang] + '</div>' : '') +
      (r.anchor ? '</a>' : '') +
      '</div>';
  }).join('');

  const sc = document.getElementById('stages-container');
  sc.innerHTML = STAGES.map(stage => {
    const daysHtml = stage.days.map(day => {
      const transport = ((isEn ? day.transport_en : day.transport_zh) || []).filter(x => typeof x === 'string' && x.trim() && !/^[，,；;、。.!?]/.test(x.trim()));
      const food = ((isEn ? day.food_en : day.food_zh) || []).filter(x => typeof x === 'string' && x.trim() && !/^[，,；;、。.!?]/.test(x.trim()));
      const acts = ((isEn ? day.activities_en : day.activities_zh) || []).filter(x => typeof x === 'string' && x.trim());
      // Show the key route just once. Detailed movements remain available on demand.
      const journey = (day.date === '16' && stage.num === 'II')
        ? (isEn ? 'Airport → Ritz-Carlton → Yongning Gate → Sajin Bridge → hotel · same pre-arranged driver'
                : '机场 → 丽思卡尔顿 → 永宁门 → 洒金桥 → 酒店 · 同一司机全程接送')
        : (transport.length ? transport[0] : '');
      const routeHtml = journey ? '<div class="transport-route"><b>'+(isEn?'Getting around':'交通')+' · </b>'+journey+'</div>' : '';
      const detailHtml = transport.length > 1 || food.length ? '<details class="day-extra"><summary>'+(isEn?'Transport & dining details':'交通与用餐细节')+'</summary>'+(transport.slice(1).length ? '<ul>'+transport.slice(1).map(x=>'<li>'+x+'</li>').join('')+'</ul>' : '')+(food.length?'<div class="meal-note">'+food.join(' · ')+'</div>':'')+'</details>' : '';
      // Avoid showing the same logistical sentences twice as primary activities.
      let visibleActs = acts;
      const aHtml = visibleActs.filter(x => typeof x === 'string' && x.trim()).map(x=>'<div class="act-row"><span class="act-dot"></span><span>'+x+'</span></div>').join('');
      return '<div class="day-entry">' +
        '<div class="day-left">' +
          '<span class="day-date-num">' + day.date + '</span>' +
          '<span class="day-dow-txt">' + (isEn ? day.dow_en : day.dow_zh) + '</span>' +
        '</div>' +
        '<div class="day-right">' +
          '<div class="day-title-txt">' + (isEn ? day.title_en : day.title_zh) + '</div>' +
          (isEn ? '<div class="day-title-zh">' + day.title_zh + '</div>' : '') +
          '<div class="day-hotel-txt">' + (isEn ? 'Stay · ' : '住宿 · ') + (isEn ? day.hotel_en : day.hotel_zh) + '</div>' +
          routeHtml +
          '<div class="acts">' + aHtml + '</div>' + detailHtml +
        '</div>' +
      '</div>';
    }).join('');

    return '<div class="stage-block" id="stage-' + stage.num + '">' +
      '<div class="stage-header">' +
        '<div class="stage-num">' + stage.num + '</div>' +
        '<div>' +
          '<div class="stage-title">' + (isEn ? stage.title_en : stage.title_zh) + '</div>' +
          (!isEn ? '' : '<div class="stage-title-zh">' + stage.title_zh + '</div>') +
          '<div class="stage-dates">' + stage.dates + '</div>' +
        '</div>' +
      '</div>' +
      daysHtml +
    '</div>';
  }).join('');
}

function setLang(l) {
  lang = l;
  document.documentElement.lang = l === "zh" ? "zh-CN" : "en";
  document.querySelectorAll('.lang-btn').forEach(b => {
    b.classList.toggle('active', b.textContent.trim() === (l === 'zh' ? '中文' : 'English'));
  });
  render();
}

render();
</script>

</body></html>
