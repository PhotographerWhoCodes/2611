<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Family China Trip 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600&family=Noto+Sans+SC:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --cream: #faf7f2;
  --cream-deep: #ede8df;
  --ink: #1e1a15;
  --ink-soft: #3d3830;
  --ink-muted: #7a7268;
  --gold: #7a5c1a;
  --gold-pale: #f0e6c8;
  --sage: #305840;
  --sage-pale: #d8eadf;
  --border: rgba(30,26,21,0.12);
  --border-soft: rgba(30,26,21,0.07);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--cream);
  color: var(--ink);
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 17px;
  line-height: 1.8;
  -webkit-font-smoothing: antialiased;
}
.lang-bar {
  position: sticky; top: 0; z-index: 100;
  background: var(--cream);
  border-bottom: 1px solid var(--border);
  padding: 10px 2rem;
  display: flex; justify-content: flex-end; gap: 6px;
}
.lang-btn {
  padding: 6px 18px; border-radius: 4px;
  border: 1.5px solid var(--border);
  background: transparent; color: var(--ink-muted);
  font-family: 'Noto Sans SC', sans-serif; font-size: 13px; cursor: pointer;
}
.lang-btn.active { background: var(--ink); color: var(--cream); border-color: var(--ink); }
.cover {
  text-align: center; padding: 4rem 2rem 3rem;
  max-width: 700px; margin: 0 auto;
  border-bottom: 1px solid var(--border);
}
#cover-ornament { font-size: 12px; letter-spacing: 0.22em; color: var(--ink-muted); margin-bottom: 1.4rem; }
#cover-title {
  font-family: 'Noto Serif SC', serif;
  font-size: clamp(1.8rem, 5vw, 2.8rem); font-weight: 600;
  line-height: 1.25; color: var(--ink); margin-bottom: 0.4rem; letter-spacing: 0.06em;
}
#cover-title-zh {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(1.2rem, 3vw, 1.7rem); font-style: italic;
  color: var(--ink-soft); margin-bottom: 2rem;
}
.cover-divider { display: flex; align-items: center; gap: 1rem; margin: 0 auto 2rem; max-width: 240px; }
.cdl { flex: 1; height: 1px; background: var(--border); }
.cdd { width: 5px; height: 5px; border-radius: 50%; background: var(--gold); flex-shrink: 0; }
#cover-meta { font-size: 16px; color: var(--ink-soft); line-height: 2; }
#cover-meta strong { color: var(--ink); font-weight: 500; }
.route-section { max-width: 820px; margin: 0 auto; padding: 2rem 2rem 1.5rem; }
#route-label { text-align: center; font-size: 11px; letter-spacing: 0.2em; color: var(--ink-muted); margin-bottom: 1.5rem; }
.route-flow { display: flex; align-items: flex-start; justify-content: center; overflow-x: auto; scrollbar-width: none; }
.route-flow::-webkit-scrollbar { display: none; }
.route-stop { display: flex; flex-direction: column; align-items: center; flex-shrink: 0; gap: 7px; }
.route-dot {
  width: 40px; height: 40px; border-radius: 50%;
  border: 1.5px solid var(--border); background: var(--cream);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 500; font-family: 'Noto Serif SC', serif; color: var(--ink-soft);
  transition: all 0.2s;
}
.route-dot.hl { border-color: var(--gold); background: var(--gold-pale); color: var(--gold); }
a:hover .route-dot.hl { background: var(--gold); color: var(--cream); }
.route-name { font-size: 12px; color: var(--ink-soft); text-align: center; line-height: 1.4; }
a .route-name { color: var(--gold); }
.route-nights { font-size: 11px; color: var(--ink-muted); text-align: center; }
.route-conn { flex-shrink: 0; display: flex; flex-direction: column; align-items: center; padding-top: 18px; min-width: 28px; }
.route-conn-line { width: 100%; height: 1px; background: var(--border); }
.route-conn-icon { font-size: 10px; color: var(--ink-muted); margin-top: 3px; }
#stages-container { max-width: 780px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }
.stage-block { margin-bottom: 2.5rem; scroll-margin-top: 52px; }
.stage-header {
  display: flex; align-items: center; gap: 1rem;
  padding: 0.7rem 1rem; background: var(--cream-deep);
  border-left: 4px solid var(--gold); border-radius: 0 5px 5px 0; margin-bottom: 1.5rem;
}
.stage-num { font-family: 'Cormorant Garamond', serif; font-size: 1.9rem; font-style: italic; color: var(--gold); line-height: 1; flex-shrink: 0; }
.stage-title { font-family: 'Noto Serif SC', serif; font-size: 1.1rem; font-weight: 400; color: var(--ink); letter-spacing: 0.06em; }
.stage-title-zh { font-size: 0.85rem; color: var(--ink-muted); letter-spacing: 0.06em; margin-top: 1px; }
.stage-dates { font-size: 12px; color: var(--ink-muted); margin-top: 2px; }
.day-entry { display: grid; grid-template-columns: 72px 1fr; gap: 0 1.5rem; padding: 1.5rem 0; border-bottom: 1px solid var(--border-soft); }
.day-entry:last-child { border-bottom: none; }
.day-left { text-align: right; padding-top: 2px; }
.day-date-num { font-family: 'Cormorant Garamond', serif; font-size: 2rem; font-style: italic; color: var(--ink); line-height: 1; display: block; }
.day-dow-txt { font-size: 11px; color: var(--ink-muted); display: block; margin-top: 3px; letter-spacing: 0.04em; }
.day-title-txt { font-family: 'Noto Serif SC', serif; font-size: 1.1rem; font-weight: 400; color: var(--ink); margin-bottom: 2px; letter-spacing: 0.04em; }
.day-title-zh { font-size: 0.82rem; color: var(--ink-muted); letter-spacing: 0.06em; margin-bottom: 10px; }
.day-hotel-txt { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; color: var(--ink-soft); background: var(--cream-deep); padding: 4px 11px; border-radius: 3px; margin-bottom: 10px; border: 1px solid var(--border); }
.pills { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
.pill-t { font-size: 12px; padding: 3px 10px; border-radius: 3px; border: 1px solid rgba(48,88,64,0.3); color: var(--sage); background: var(--sage-pale); line-height: 1.4; }
.pill-f { font-size: 12px; padding: 3px 10px; border-radius: 3px; border: 1px solid rgba(122,92,26,0.3); color: var(--gold); background: var(--gold-pale); line-height: 1.4; }
.acts { font-size: 15px; color: var(--ink-soft); line-height: 1.9; }
.act-row { display: flex; align-items: baseline; gap: 9px; margin-bottom: 1px; }
.act-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--gold); flex-shrink: 0; margin-top: 10px; }
.footer { text-align: center; padding: 2.5rem 2rem 3.5rem; border-top: 1px solid var(--border); max-width: 780px; margin: 0 auto; }
#footer-title { font-family: 'Noto Serif SC', serif; font-size: 1.2rem; font-weight: 400; color: var(--ink-soft); letter-spacing: 0.1em; margin-bottom: 0.4rem; }
.footer-sub { font-size: 13px; color: var(--ink-muted); }
a { text-decoration: none; }
@media (max-width: 560px) {
  .cover { padding: 2.5rem 1.25rem 2rem; }
  .day-entry { grid-template-columns: 58px 1fr; gap: 0 1rem; }
  .day-date-num { font-size: 1.7rem; }
  #stages-container { padding: 0 1rem 3rem; }
  .route-section { padding: 1.5rem 1rem; }
  .lang-bar { padding: 10px 1rem; }
}
</style>
</head>

let lang = 'zh';

const T = {
  ornament: { zh: '家庭旅行 · 2026年11月', en: 'Family Journey · November 2026' },
  title: { zh: '我们的中国行', en: 'Our China Journey' },
  sub: { zh: '古老传统 · 现代科技 · 家人同行', en: 'Ancient traditions · Modern marvels · Together' },
  meta: {
    zh: '<strong>Nov 15 – 29, 2026 · 11月15日—11月29日</strong><br>8大1小 · 西安 · 杭州 · 皖南 · 上海',
    en: "<strong>Nov 15 – 29, 2026 · November 15–29</strong><br>8 adults + 1 child · Xi'an · Hangzhou · Anhui · Shanghai"
  },
  routeLabel: { zh: '行程路线', en: 'The Route' },
  footer: { zh: '一路顺风，平安归来', en: 'Safe travels, wonderful memories' }
};

const ROUTE = [
  { dot: '✈', hl: false, name: { zh: '上海落地', en: 'Land Shanghai' }, nights: { zh: '1晚', en: '1 night' }, anchor: 'stage-I' },
  { conn: '✈' },
  { dot: '秦', hl: true, name: { zh: "Xi'an 西安", en: "Xi'an" }, nights: { zh: '3晚', en: '3 nights' }, anchor: 'stage-II' },

  { conn: '✈' },
  { dot: '🏠', hl: false, name: { zh: 'DC 回家', en: 'DC Home' }, nights: { zh: '', en: '' }, anchor: null }
];

function t(key) { return T[key][lang]; }

function render() {
  const isEn = lang === 'en';
  document.getElementById('cover-ornament').textContent = t('ornament');
  document.getElementById('cover-title').textContent = t('title');
  const titleZh = document.getElementById('cover-title-zh');
  if (titleZh) titleZh.textContent = isEn ? 'Ancient traditions · Modern marvels · Together' : '古老传统 · 现代科技 · 家人同行';
  const coverSub = document.getElementById('cover-sub');
  if (coverSub) coverSub.textContent = t('sub');
  document.getElementById('cover-meta').innerHTML = t('meta');
  document.getElementById('route-label').textContent = t('routeLabel');
  document.getElementById('footer-title').textContent = t('footer');

  const rf = document.getElementById('route-flow');
  rf.innerHTML = ROUTE.map(r => {
    if (r.conn) {
      return '<div class="route-conn"><div class="route-conn-line"></div><div class="route-conn-icon">' + r.conn + '</div></div>';
    }
    return '<div class="route-stop">' +
      (r.anchor ? '<a href="#' + r.anchor + '" style="text-decoration:none;display:contents">' : '') +
      '<div class="route-dot' + (r.hl ? ' hl' : '') + '" style="' + (r.anchor ? 'cursor:pointer' : '') + '">' + r.dot + '</div>' +
      '<div class="route-name" style="' + (r.anchor ? 'color:#7a5c1a' : '') + '">' + r.name[lang] + '</div>' +
      (r.nights[lang] ? '<div class="route-nights">' + r.nights[lang] + '</div>' : '') +
      (r.anchor ? '</a>' : '') +
      '</div>';
  }).join('');

  const sc = document.getElementById('stages-container');
  sc.innerHTML = STAGES.map(stage => {
    const daysHtml = stage.days.map(day => {
      const transport = (isEn ? day.transport_en : day.transport_zh) || [];
      const food = (isEn ? day.food_en : day.food_zh) || [];
      const acts = (isEn ? day.activities_en : day.activities_zh) || [];
      const tHtml = transport.map(x => '<span class="pill-t">' + x + '</span>').join('');
      const fHtml = food.map(x => '<span class="pill-f">' + x + '</span>').join('');
      const aHtml = acts.map(x => '<div class="act-row"><div class="act-dot"></div><span>' + x + '</span></div>').join('');
      return '<div class="day-entry">' +
        '<div class="day-left">' +
          '<span class="day-date-num">' + day.date + '</span>' +
          '<span class="day-dow-txt">' + (isEn ? day.dow_en : day.dow_zh) + '</span>' +
        '</div>' +
        '<div class="day-right">' +
          '<div class="day-title-txt">' + (isEn ? day.title_en : day.title_zh) + '</div>' +
          (isEn ? '<div class="day-title-zh">' + day.title_zh + '</div>' : '') +
          '<div class="day-hotel-txt">' + (isEn ? 'Stay · ' : '住宿 · ') + (isEn ? day.hotel_en : day.hotel_zh) + '</div>' +
          (tHtml || fHtml ? '<div class="pills">' + tHtml + fHtml + '</div>' : '') +
          '<div class="acts">' + aHtml + '</div>' +
        '</div>' +
      '</div>';
    }).join('');

    return '<div class="stage-block" id="stage-' + stage.num + '">' +
      '<div class="stage-header">' +
        '<div class="stage-num">' + stage.num + '</div>' +
        '<div>' +
          '<div class="stage-title">' + (isEn ? stage.title_en : stage.title_zh) + '</div>' +
          (!isEn ? '' : '<div class="stage-title-zh">' + stage.title_zh + '</div>') +
          '<div class="stage-dates">' + stage.dates + '</div>' +
        '</div>' +
      '</div>' +
      daysHtml +
    '</div>';
  }).join('');
}

function setLang(l) {
  lang = l;
  document.querySelectorAll('.lang-btn').forEach(b => {
    b.classList.toggle('active', b.textContent.trim() === (l === 'zh' ? '中文' : 'English'));
  });
  render();
}
